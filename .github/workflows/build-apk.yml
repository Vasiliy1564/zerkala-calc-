name: Build APK

on:
  push:
    branches: [ main, ccr-* ]
    paths:
      - 'app-android/**'
      - 'app-kalk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      working-directory: ./app-android/kalkulyator
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: apk
        path: app-android/kalkulyator/build/outputs/apk/release/*.apk

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: app-android/kalkulyator/build/outputs/apk/release/*.apk
        tag_name: auto-${{ github.run_number }}
        body: "Automatic build from commit ${{ github.sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
