name: Put-Rossiya APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Адрес сервера на Vercel, например https://put-rossiya.vercel.app'
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web assets
        run: |
          mkdir -p /tmp/app/www && cd /tmp/app
          cp -r "$GITHUB_WORKSPACE"/put-rossiya/{index.html,app.js,icon.svg,vendor} www/
          printf "window.PUT_RU_API=%s;\nwindow.PUT_SPB_URL='https://zerkalo-pro-spb.ru/put-peterburg/';\n" "$(printf '%s' '${{ inputs.api_url }}' | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')" > www/config.js
          npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Путь Россия" ru.zerkalopro.putrossiya --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: /tmp/app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/put-rossiya.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: put-rossiya-apk
          path: put-rossiya.apk
          compression-level: 0
      - name: Publish APK as a single downloadable file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: put-rossiya-${{ github.run_number }}
          name: Путь Россия (демо) #${{ github.run_number }}
          prerelease: true
          files: put-rossiya.apk
