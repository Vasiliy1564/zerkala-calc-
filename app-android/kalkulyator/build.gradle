plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.zerkalopro.calc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zerkalopro.calc'
        minSdk 21
        targetSdk 34
        versionCode 24
        versionName '24'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
