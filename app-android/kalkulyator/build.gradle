plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zerkalopro.calc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zerkalopro.calc'
        minSdk 21
        targetSdk 34
        versionCode 20
        versionName '20'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}
