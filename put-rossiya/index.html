<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8853c"><title>Путь • Россия (демо)</title>
<link rel="stylesheet" href="vendor/leaflet.css"><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff1d5;color:#223654;font:16px system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-size:28px;font-weight:800;letter-spacing:-1px}.brand b{color:#c83a24}
.badge{font-size:10px;background:#ffe0ac;color:#925013;padding:6px 9px;border-radius:20px}
h2{font-size:13px;letter-spacing:1.2px;color:#6d3cac;margin:22px 0 8px}
.card{background:#fffaf2;border:1px solid #edbe8b;border-radius:18px;padding:14px;margin:10px 0}
input{width:100%;font:inherit;padding:12px;border:1px solid #e8ae6a;border-radius:12px;background:#fff;color:#223654}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:8px 12px;background:#e8efff;color:#174f9e}
button.main{background:#1859b5;color:#fff}button:disabled{opacity:.5}
.list button{display:block;width:100%;text-align:left;margin:6px 0;background:#fff7e9;border:1px solid #e9b876;color:#223654}
.list small{display:block;color:#245c9c;margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:1;min-width:110px}
#map{height:340px;border-radius:16px;border:1px solid #d1bba3;margin:10px 0;z-index:0}
.status{font-size:13px;color:#82420d;background:#ffe9c0;border-radius:12px;padding:10px;margin:10px 0}.status:empty{display:none}
.pt{font-size:14px;margin:4px 0}.pt b{color:#b4232c}
ol{padding-left:20px;font-size:14px;line-height:1.6;color:#245c9c}
.mode button[aria-pressed=true]{background:#1859b5;color:#fff}
a{color:#174f9e}
.pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:3px solid #fff;border-radius:50%;color:#fff;font:800 13px system-ui;box-shadow:0 1px 4px #0006}
</style></head><body><main>
<header><div class="brand">путь<b>↗</b> Россия</div><span class="badge">ДЕМО 0.1</span></header>

<h2>1. ГОРОД, СЕЛО ИЛИ НАСЕЛЁННЫЙ ПУНКТ</h2>
<div class="card">
  <input id="cityQ" placeholder="Например: Казань, Кириллов, Эльтон" autocomplete="off" aria-label="Населённый пункт">
  <div id="cityList" class="list"></div>
  <div id="cityNow" class="pt"></div>
  <div class="row"><button id="spb" type="button">Петербург: полное приложение →</button></div>
</div>

<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="map" role="region" aria-label="Карта 2ГИС"></div>

<h2>2. ПОИСК МЕСТА ПО НАСЕЛЁННОМУ ПУНКТУ</h2>
<div class="card">
  <input id="placeQ" placeholder="Аптека, вокзал, улица Ленина…" autocomplete="off" aria-label="Поиск места">
  <div class="row"><button id="placeGo" class="main" type="button" disabled>Найти рядом с центром карты</button></div>
  <div id="placeList" class="list"></div>
</div>

<h2>3. МАРШРУТ</h2>
<div class="card">
  <div class="pt">Откуда: <b id="aName">не выбрано</b></div>
  <div class="pt">Куда: <b id="bName">не выбрано</b></div>
  <div class="row"><button id="here" type="button">◎ Откуда: где я</button><button id="swap" type="button">↕ Поменять</button></div>
  <div class="row mode"><button id="mWalk" aria-pressed="true" type="button">Пешком</button><button id="mDrive" aria-pressed="false" type="button">На машине</button></div>
  <div class="row"><button id="go" class="main" type="button" disabled>Построить маршрут</button></div>
  <div id="routeInfo" class="pt"></div><ol id="steps"></ol>
</div>
<p class="pt">Карта и данные © <a href="https://2gis.ru/" target="_blank" rel="noopener">2ГИС</a>. В малых сёлах часть мест может отсутствовать.</p>
</main>
<script src="config.js"></script><script src="vendor/leaflet.js"></script><script src="app.js"></script>
</body></html>
