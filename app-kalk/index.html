<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Калькулятор зеркал</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1f1a16}
#app{width:100%;height:100%;border:none}
</style>
</head>
<body>
<iframe id="app" src="classic.html"></iframe>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='127.0.0.1')){
 navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(function(){});
}
var i=document.getElementById('app');
i.onload=function(){
 try{
  var w=i.contentWindow,d=i.contentDocument;
  var s=d.createElement('style');
  s.innerHTML='@import url(/app-kalk/owner.css);';
  d.head.appendChild(s);
  var sc=d.createElement('script');
  sc.src='/app-kalk/owner.js';
  d.body.appendChild(sc);
 }catch(e){}
};
setTimeout(function(){
 if(!i.contentDocument)i.src='classic.html';
},100);
</script>
</body>
</html>
